<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca Viva</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { background: #f5f7fb; color: #172033; margin: 0; }
    main { margin: 0 auto; max-width: 860px; padding: 2rem 1rem; }
    .hero, .card { background: white; border-radius: 12px; box-shadow: 0 2px 12px #17203318; padding: 1.25rem; }
    .hero { margin-bottom: 1rem; }
    .books { display: grid; gap: .75rem; }
    .book { border-left: 4px solid #335cdd; padding: .8rem 1rem; }
    h1 { margin-top: 0; }
    .muted { color: #536078; }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title" tabindex="0">Biblioteca Viva</h1>
      <p class="muted">Seu catálogo simples de livros.</p>
    </section>
    <section class="card" aria-labelledby="catalog-title">
      <h2 id="catalog-title">Livros cadastrados</h2>
      <div id="book-list" class="books" aria-live="polite">
        <p>Carregando catálogo...</p>
      </div>
    </section>
  </main>
  <script>
    async function loadBooks() {
      const response = await fetch('/livros');
      const books = await response.json();
      const list = document.querySelector('#book-list');
      list.replaceChildren(...books.map(book => {
        const article = document.createElement('article');
        article.className = 'book';
        article.innerHTML = `<h3>${book.titulo}</h3><p>${book.autor}</p><small>${book.generos.join(' · ')}</small>`;
        return article;
      }));
    }
    loadBooks();
  </script>
</body>
</html>
